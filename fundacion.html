<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundación Francisco Lorenzo - Administración</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="fundacion.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">
                <i class="fa-solid fa-hand-holding-heart"></i>
                <div>
                    <h2>Fundación Francisco Lorenzo</h2>
                    <p style="font-size: 12px; opacity: 0.8;">Módulo de Administración</p>
                </div>
            </div>
            <div class="user-info" id="userInfo">
                <div class="avatar" id="userAvatar">A</div>
                <div>
                    <strong id="userName">Administrador</strong>
                    <p style="font-size: 11px;" id="userRole">Admin</p>
                </div>
            </div>
        </div>

        <!-- NAVEGACIÓN -->
        <div class="nav" id="nav">
            <button class="nav-item active" onclick="cambiarSeccion('inicio')">🏠 Inicio</button>
            <button class="nav-item" onclick="cambiarSeccion('usuarios')">👥 Usuarios</button>
            <button class="nav-item" onclick="cambiarSeccion('agua')">💧 Proyecto Agua</button>
            <button class="nav-item" onclick="cambiarSeccion('cursos')">📚 Cursos</button>
            <button class="nav-item" onclick="cambiarSeccion('reportes')">📊 Reportes</button>
            <button class="nav-item" onclick="cambiarSeccion('recordatorios')">📱 Recordatorios</button>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div id="content" style="min-height: 500px;">
            <div style="text-align: center; padding: 100px;">
                <div class="loading"></div>
                <p style="margin-top: 20px;">Cargando sistema...</p>
            </div>
        </div>
    </div>

    <!-- MODAL USUARIO -->
    <div class="modal hidden" id="modalUsuario">
        <div class="modal-content">
            <h3 id="modalUsuarioTitulo">✏️ Editar Usuario</h3>
            <input type="hidden" id="editFirebaseKey">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="userNombre" class="form-control" placeholder="Ej: Juan Pérez">
            </div>
            <div class="form-group">
                <label>Usuario (automático)</label>
                <input type="text" id="userUsuario" class="form-control" readonly>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="text" id="userPassword" class="form-control" placeholder="Dejar en blanco para mantener">
            </div>
            <div class="form-group">
                <label>WhatsApp</label>
                <input type="text" id="userWhatsapp" class="form-control" placeholder="8095551212">
            </div>
            <div class="form-group">
                <label>Zona (para agua)</label>
                <input type="text" id="userZona" class="form-control" placeholder="Piragua Arriba">
            </div>
            <div class="form-group">
                <label>Monto Mensual</label>
                <input type="number" id="userMonto" class="form-control" value="500">
            </div>
            <div class="form-group">
                <label>Tipo de Usuario</label>
                <select id="userTipo" class="form-control">
                    <option value="agua">💧 Solo Proyecto Agua</option>
                    <option value="curso">📚 Solo Cursos</option>
                    <option value="ambos">💧📚 Ambos</option>
                </select>
            </div>
            <div class="form-group">
                <label>Día de Corte</label>
                <input type="number" id="userDiaCorte" class="form-control" value="25" min="1" max="31">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-success" style="flex:1;" onclick="guardarUsuario()">💾 Guardar</button>
                <button class="btn btn-danger" style="flex:1;" onclick="cerrarModal('modalUsuario')">✖ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL PAGO -->
    <div class="modal hidden" id="modalPago">
        <div class="modal-content">
            <h3>💰 Registrar Pago</h3>
            <div class="form-group">
                <label>Buscar Cliente</label>
                <input type="text" id="buscarCliente" class="form-control" placeholder="Nombre o WhatsApp..." onkeyup="buscarClientesPago()">
            </div>
            <div id="resultadoBusquedaPago" style="max-height: 300px; overflow-y: auto;"></div>
            <div id="formPago" class="hidden">
                <h4 id="clientePagoNombre"></h4>
                <div class="form-group">
                    <label>Monto a Pagar</label>
                    <input type="number" id="montoPago" class="form-control" min="1">
                </div>
                <div class="form-group">
                    <label>Mes correspondiente</label>
                    <select id="mesPago" class="form-control">
                        <option value="1">Enero</option>
                        <option value="2">Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Septiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="pagoAdelantado">
                    <label for="pagoAdelantado">Pago adelantado</label>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-success" onclick="procesarPago()">💾 Procesar Pago</button>
                    <button class="btn btn-warning" onclick="mostrarBusquedaClientes()">↩️ Volver</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL FACTURA -->
    <div class="modal hidden" id="modalFactura">
        <div class="modal-content" style="max-width: 400px;">
            <h3>🧾 Factura / Ticket</h3>
            <div id="facturaContenido" class="ticket"></div>
            <div style="display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap;">
                <button class="btn btn-success" onclick="enviarFacturaWhatsApp()">📱 WhatsApp</button>
                <button class="btn btn-primary" onclick="imprimirTicket()">🖨️ Imprimir</button>
                <button class="btn btn-danger" onclick="cerrarModal('modalFactura')">✖ Cerrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL RECORDATORIO -->
    <div class="modal hidden" id="modalRecordatorio">
        <div class="modal-content">
            <h3>📱 Enviar Recordatorio</h3>
            <div class="recordatorio-options">
                <div class="recordatorio-option" onclick="seleccionarTipoRecordatorio('agua')" id="optAgua">
                    <i class="fa-solid fa-water fa-2x" style="color: #00a8ff;"></i>
                    <h4>Proyecto Agua</h4>
                </div>
                <div class="recordatorio-option" onclick="seleccionarTipoRecordatorio('cursos')" id="optCursos">
                    <i class="fa-solid fa-graduation-cap fa-2x" style="color: #9b59b6;"></i>
                    <h4>Cursos</h4>
                </div>
                <div class="recordatorio-option" onclick="seleccionarTipoRecordatorio('todos')" id="optTodos">
                    <i class="fa-solid fa-users fa-2x" style="color: #27ae60;"></i>
                    <h4>Todos</h4>
                </div>
            </div>
            <div id="recordatorioDetalle" class="hidden">
                <div class="form-group">
                    <label>Mensaje a enviar:</label>
                    <textarea id="mensajeRecordatorio" class="form-control" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label>Clientes: <span id="totalClientesRecordatorio">0</span></label>
                    <div style="max-height: 200px; overflow-y: auto; border:1px solid #ddd; padding:10px; border-radius:8px;">
                        <div id="listaClientesRecordatorio"></div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-success" onclick="enviarRecordatorios()">📱 Enviar WhatsApp</button>
                    <button class="btn btn-danger" onclick="cerrarModal('modalRecordatorio')">✖ Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="fundacion.js"></script>
</body>
</html>
