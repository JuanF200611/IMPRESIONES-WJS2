<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Creator - Impresiones WJS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Formulario */
        .form-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 {
            color: #34495e;
            margin: 25px 0 15px;
            border-left: 5px solid #7f00ff;
            padding-left: 15px;
        }

        .id-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .id-section input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(45deg, #7f00ff, #00c6ff);
            color: white;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Foto */
        .foto-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .foto-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #7f00ff;
            margin-bottom: 15px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .foto-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .foto-preview i {
            font-size: 70px;
            color: #bdc3c7;
        }

        #foto {
            display: none;
        }

        .btn-foto {
            background: #3498db;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
        }

        /* Grid de datos */
        .grid-datos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .field input, .field textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
        }

        /* Items dinámicos */
        .item-grid {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .item-grid input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }

        .btn-eliminar {
            background: #e74c3c;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        .btn-agregar {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            margin: 10px 0;
            cursor: pointer;
        }

        /* Plantillas */
        .plantillas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .plantilla-card {
            cursor: pointer;
            border: 3px solid transparent;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .plantilla-card.active {
            border-color: #7f00ff;
            transform: scale(1.02);
        }

        .plantilla-preview {
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .plantilla-clasica {
            background: linear-gradient(135deg, #2c3e50, #3498db);
        }

        .plantilla-moderna {
            background: linear-gradient(135deg, #8e44ad, #e74c3c);
        }

        .plantilla-profesional {
            background: linear-gradient(135deg, #d35400, #f39c12);
        }

        .plantilla-card span {
            display: block;
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            font-weight: 600;
        }

        /* Vista previa */
        .preview-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .cv-paper {
            max-width: 800px;
            margin: 0 auto;
            background: white;
        }

        /* Plantilla Clásica */
        .cv-clasica .cv-header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .cv-clasica .cv-section {
            margin: 25px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 15px;
        }

        /* Plantilla Moderna */
        .cv-moderna .cv-header {
            background: linear-gradient(135deg, #8e44ad, #e74c3c);
            color: white;
            padding: 30px;
            border-radius: 15px 15px 0 0;
        }

        .cv-moderna .cv-section {
            margin: 20px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(142,68,173,0.1);
        }

        /* Plantilla Profesional */
        .cv-profesional .cv-header {
            background: #d35400;
            color: white;
            padding: 30px;
            border-bottom: 5px solid #f39c12;
        }

        .cv-profesional .cv-section {
            margin: 20px;
            border-left: 5px solid #d35400;
            padding-left: 20px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 15px 0;
        }

        .referencia-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        .acciones {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Formulario -->
        <div class="form-container">
            <h1><i class="fa-solid fa-file-pen"></i> Creador de Currículum</h1>

            <!-- ID Cliente -->
            <div class="id-section">
                <input type="text" id="usuarioId" placeholder="ID del Cliente (ej: WJS-00123)" value="WJS-00123">
                <button class="btn btn-primary" onclick="cargarDatos()">
                    <i class="fa-solid fa-download"></i> Cargar Datos
                </button>
            </div>

            <!-- Foto -->
            <div class="foto-section">
                <div class="foto-preview" id="fotoPreview">
                    <i class="fa-solid fa-user"></i>
                </div>
                <label for="foto" class="btn-foto">
                    <i class="fa-solid fa-camera"></i> Seleccionar Foto
                </label>
                <input type="file" id="foto" accept="image/*">
            </div>

            <!-- Datos Personales -->
            <h2>Datos Personales</h2>
            <div class="grid-datos">
                <div class="field"><input type="text" id="nombre" placeholder="Nombre completo" value="ELINA ALTAGRACIA SANCHEZ VOLQUEZ"></div>
                <div class="field"><input type="text" id="direccion" placeholder="Dirección" value="Calle Principal #123, Santo Domingo"></div>
                <div class="field"><input type="text" id="telefono" placeholder="Teléfono" value="(809) 555-1234"></div>
                <div class="field"><input type="email" id="correo" placeholder="Correo electrónico" value="elina.sanchez@email.com"></div>
                <div class="field"><input type="text" id="nacionalidad" placeholder="Nacionalidad" value="Dominicana"></div>
                <div class="field"><input type="text" id="estadoCivil" placeholder="Estado civil" value="Soltera"></div>
                <div class="field"><input type="text" id="cedula" placeholder="Cédula" value="001-1234567-8"></div>
                <div class="field"><input type="date" id="nacimiento" value="1990-01-15"></div>
            </div>

            <!-- Objetivo -->
            <h2>Objetivo Profesional</h2>
            <textarea id="objetivo" rows="3" style="width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px;">Profesional de enfermería con experiencia en atención al cliente y manejo de farmacia, buscando aportar mis conocimientos en un entorno dinámico.</textarea>

            <!-- Educación -->
            <h2>Educación</h2>
            <div id="educacionContainer"></div>
            <button class="btn-agregar" onclick="agregarEducacion()">
                <i class="fa-solid fa-plus"></i> Agregar Educación
            </button>

            <!-- Experiencia -->
            <h2>Experiencia Laboral</h2>
            <div id="experienciaContainer"></div>
            <button class="btn-agregar" onclick="agregarExperiencia()">
                <i class="fa-solid fa-plus"></i> Agregar Experiencia
            </button>

            <!-- Cursos -->
            <h2>Cursos y Talleres</h2>
            <div id="cursosContainer"></div>
            <button class="btn-agregar" onclick="agregarCurso()">
                <i class="fa-solid fa-plus"></i> Agregar Curso
            </button>

            <!-- Referencias -->
            <h2>Referencias (Máx 3)</h2>
            <div id="referenciasContainer"></div>
            <button class="btn-agregar" onclick="agregarReferencia()">
                <i class="fa-solid fa-plus"></i> Agregar Referencia
            </button>

            <!-- Plantillas -->
            <h2>Seleccionar Plantilla</h2>
            <div class="plantillas-grid">
                <div class="plantilla-card active" onclick="seleccionarPlantilla('clasica', this)">
                    <div class="plantilla-preview plantilla-clasica">
                        <i class="fa-solid fa-file-lines" style="font-size: 40px; margin-bottom: 10px;"></i>
                        <span>Clásica</span>
                    </div>
                </div>
                <div class="plantilla-card" onclick="seleccionarPlantilla('moderna', this)">
                    <div class="plantilla-preview plantilla-moderna">
                        <i class="fa-solid fa-pen-fancy" style="font-size: 40px; margin-bottom: 10px;"></i>
                        <span>Moderna</span>
                    </div>
                </div>
                <div class="plantilla-card" onclick="seleccionarPlantilla('profesional', this)">
                    <div class="plantilla-preview plantilla-profesional">
                        <i class="fa-solid fa-briefcase" style="font-size: 40px; margin-bottom: 10px;"></i>
                        <span>Profesional</span>
                    </div>
                </div>
            </div>

            <!-- Acciones -->
            <div class="acciones">
                <button class="btn btn-success" onclick="guardarCV()">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar
                </button>
                <button class="btn btn-warning" onclick="actualizarVistaPrevia()">
                    <i class="fa-solid fa-eye"></i> Actualizar Vista
                </button>
                <button class="btn btn-danger" onclick="generarPDF()">
                    <i class="fa-solid fa-file-pdf"></i> PDF
                </button>
            </div>
        </div>

        <!-- Vista Previa -->
        <div class="preview-container" id="previewContainer">
            <h2><i class="fa-solid fa-eye"></i> Vista Previa del Currículum</h2>
            <div id="vistaPrevia"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB3xTYP7wKgvFvySX8ZkHqm0Tly8y4LcM4",
            authDomain: "imprecioneswjs.firebaseapp.com",
            databaseURL: "https://imprecioneswjs-default-rtdb.firebaseio.com",
            projectId: "imprecioneswjs",
            storageBucket: "imprecioneswjs.appspot.com",
            appId: "1:923402098800:web:ef57d1e1bf1fdd758a3cb5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Variables globales
        let plantillaActual = 'clasica';
        let fotoBase64 = null;

        // Inicializar con datos de ejemplo
        window.onload = function() {
            // Agregar items por defecto basados en el ejemplo de Elina
            agregarEducacion('Escuela Ramona Neriz Soza', 'Bachiller');
            agregarEducacion('Universidad Uniremoh', 'Enfermería (cursando 8vo)');
            
            agregarExperiencia('Botica Popular del Pueblo', 'Farmacia - 1 año');
            agregarExperiencia('Farmacia Yelianni', 'Auxiliar de Cajera');
            
            agregarCurso('Informática', 'ITAN');
            agregarCurso('Cajera bancaria', 'INFOTEP');
            agregarCurso('Secretaría ejecutiva', 'INFOTEP');
            agregarCurso('Farmacia técnica', 'INFOTEP');
            
            agregarReferencia('Marcia Volquez', '(829) 262-0425');
            agregarReferencia('Francisco Montero', '(829) 909-6278');
            agregarReferencia('Anyelina Nova', '(829) 297-1079');
            
            actualizarVistaPrevia();
        };

        // Funciones para agregar items
        window.agregarEducacion = function(institucion = '', titulo = '') {
            const container = document.getElementById('educacionContainer');
            const div = document.createElement('div');
            div.className = 'item-grid';
            div.innerHTML = `
                <input type="text" class="edu-institucion" placeholder="Institución" value="${institucion}">
                <input type="text" class="edu-titulo" placeholder="Título" value="${titulo}">
                <button class="btn-eliminar" onclick="this.parentElement.remove()">✖</button>
            `;
            container.appendChild(div);
        };

        window.agregarExperiencia = function(empresa = '', puesto = '') {
            const container = document.getElementById('experienciaContainer');
            const div = document.createElement('div');
            div.className = 'item-grid';
            div.innerHTML = `
                <input type="text" class="exp-empresa" placeholder="Empresa" value="${empresa}">
                <input type="text" class="exp-puesto" placeholder="Puesto" value="${puesto}">
                <button class="btn-eliminar" onclick="this.parentElement.remove()">✖</button>
            `;
            container.appendChild(div);
        };

        window.agregarCurso = function(nombre = '', institucion = '') {
            const container = document.getElementById('cursosContainer');
            const div = document.createElement('div');
            div.className = 'item-grid';
            div.innerHTML = `
                <input type="text" class="curso-nombre" placeholder="Nombre del curso" value="${nombre}">
                <input type="text" class="curso-institucion" placeholder="Institución" value="${institucion}">
                <button class="btn-eliminar" onclick="this.parentElement.remove()">✖</button>
            `;
            container.appendChild(div);
        };

        window.agregarReferencia = function(nombre = '', telefono = '') {
            const container = document.getElementById('referenciasContainer');
            if (container.children.length >= 3) {
                alert('Máximo 3 referencias');
                return;
            }
            const div = document.createElement('div');
            div.className = 'item-grid';
            div.innerHTML = `
                <input type="text" class="ref-nombre" placeholder="Nombre completo" value="${nombre}">
                <input type="text" class="ref-telefono" placeholder="Teléfono" value="${telefono}">
                <button class="btn-eliminar" onclick="this.parentElement.remove()">✖</button>
            `;
            container.appendChild(div);
        };

        // Seleccionar plantilla
        window.seleccionarPlantilla = function(plantilla, element) {
            plantillaActual = plantilla;
            document.querySelectorAll('.plantilla-card').forEach(card => {
                card.classList.remove('active');
            });
            element.classList.add('active');
            actualizarVistaPrevia();
        };

        // Foto
        document.getElementById('foto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    fotoBase64 = event.target.result;
                    document.getElementById('fotoPreview').innerHTML = `<img src="${fotoBase64}" alt="Foto">`;
                    actualizarVistaPrevia();
                };
                reader.readAsDataURL(file);
            }
        });

        // Cargar datos desde Firebase
        window.cargarDatos = async function() {
            const usuarioId = document.getElementById('usuarioId').value.trim();
            if (!usuarioId) {
                alert('Ingresa un ID de usuario');
                return;
            }

            try {
                const snapshot = await get(ref(db, `curriculos/${usuarioId}`));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    
                    // Cargar foto
                    if (data.foto) {
                        fotoBase64 = data.foto;
                        document.getElementById('fotoPreview').innerHTML = `<img src="${fotoBase64}" alt="Foto">`;
                    }

                    // Cargar datos personales
                    document.getElementById('nombre').value = data.datosPersonales?.nombre || '';
                    document.getElementById('direccion').value = data.datosPersonales?.direccion || '';
                    document.getElementById('telefono').value = data.datosPersonales?.telefono || '';
                    document.getElementById('correo').value = data.datosPersonales?.correo || '';
                    document.getElementById('nacionalidad').value = data.datosPersonales?.nacionalidad || '';
                    document.getElementById('estadoCivil').value = data.datosPersonales?.estadoCivil || '';
                    document.getElementById('cedula').value = data.datosPersonales?.cedula || '';
                    document.getElementById('nacimiento').value = data.datosPersonales?.nacimiento || '';
                    document.getElementById('objetivo').value = data.objetivo || '';

                    // Limpiar y cargar arrays
                    document.getElementById('educacionContainer').innerHTML = '';
                    document.getElementById('experienciaContainer').innerHTML = '';
                    document.getElementById('cursosContainer').innerHTML = '';
                    document.getElementById('referenciasContainer').innerHTML = '';

                    (data.educacion || []).forEach(item => agregarEducacion(item.institucion, item.titulo));
                    (data.experiencia || []).forEach(item => agregarExperiencia(item.empresa, item.puesto));
                    (data.cursos || []).forEach(item => agregarCurso(item.nombre, item.institucion));
                    (data.referencias || []).forEach(item => agregarReferencia(item.nombre, item.telefono));

                    // Cargar plantilla
                    if (data.plantilla) {
                        const cards = document.querySelectorAll('.plantilla-card');
                        plantillaActual = data.plantilla;
                        cards.forEach((card, index) => {
                            card.classList.remove('active');
                            if ((data.plantilla === 'clasica' && index === 0) ||
                                (data.plantilla === 'moderna' && index === 1) ||
                                (data.plantilla === 'profesional' && index === 2)) {
                                card.classList.add('active');
                            }
                        });
                    }

                    actualizarVistaPrevia();
                    alert('Datos cargados correctamente');
                } else {
                    alert('No se encontraron datos para este ID');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar datos: ' + error.message);
            }
        };

        // Guardar en Firebase
        window.guardarCV = async function() {
            const usuarioId = document.getElementById('usuarioId').value.trim();
            if (!usuarioId) {
                alert('Ingresa un ID de usuario');
                return;
            }

            // Recolectar datos
            const datosPersonales = {
                nombre: document.getElementById('nombre').value,
                direccion: document.getElementById('direccion').value,
                telefono: document.getElementById('telefono').value,
                correo: document.getElementById('correo').value,
                nacionalidad: document.getElementById('nacionalidad').value,
                estadoCivil: document.getElementById('estadoCivil').value,
                cedula: document.getElementById('cedula').value,
                nacimiento: document.getElementById('nacimiento').value
            };

            const educacion = [];
            document.querySelectorAll('#educacionContainer .item-grid').forEach(el => {
                educacion.push({
                    institucion: el.querySelector('.edu-institucion')?.value || '',
                    titulo: el.querySelector('.edu-titulo')?.value || ''
                });
            });

            const experiencia = [];
            document.querySelectorAll('#experienciaContainer .item-grid').forEach(el => {
                experiencia.push({
                    empresa: el.querySelector('.exp-empresa')?.value || '',
                    puesto: el.querySelector('.exp-puesto')?.value || ''
                });
            });

            const cursos = [];
            document.querySelectorAll('#cursosContainer .item-grid').forEach(el => {
                cursos.push({
                    nombre: el.querySelector('.curso-nombre')?.value || '',
                    institucion: el.querySelector('.curso-institucion')?.value || ''
                });
            });

            const referencias = [];
            document.querySelectorAll('#referenciasContainer .item-grid').forEach(el => {
                referencias.push({
                    nombre: el.querySelector('.ref-nombre')?.value || '',
                    telefono: el.querySelector('.ref-telefono')?.value || ''
                });
            });

            const cvData = {
                usuarioId,
                foto: fotoBase64,
                datosPersonales,
                objetivo: document.getElementById('objetivo').value,
                educacion,
                experiencia,
                cursos,
                referencias,
                plantilla: plantillaActual,
                fechaActualizacion: new Date().toISOString()
            };

            try {
                await set(ref(db, `curriculos/${usuarioId}`), cvData);
                alert('✅ Currículum guardado correctamente');
            } catch (error) {
                console.error('Error:', error);
                alert('Error al guardar: ' + error.message);
            }
        };

        // Actualizar vista previa
        window.actualizarVistaPrevia = function() {
            const datos = recolectarDatos();
            const preview = document.getElementById('vistaPrevia');
            
            let fotoHTML = '<i class="fa-solid fa-user"></i>';
            if (datos.foto) {
                fotoHTML = `<img src="${datos.foto}" alt="Foto">`;
            }

            preview.innerHTML = `
                <div class="cv-paper cv-${plantillaActual}">
                    <div class="cv-header">
                        <div class="foto-preview" style="margin: 0 auto 20px;">
                            ${fotoHTML}
                        </div>
                        <h1>${datos.nombre || 'Nombre Completo'}</h1>
                        <p><i class="fa-solid fa-bullseye"></i> ${datos.objetivo || 'Objetivo Profesional'}</p>
                    </div>

                    <div style="padding: 30px;">
                        <div class="grid-2">
                            <div><i class="fa-solid fa-phone"></i> ${datos.telefono || 'Teléfono'}</div>
                            <div><i class="fa-solid fa-envelope"></i> ${datos.correo || 'Email'}</div>
                            <div><i class="fa-solid fa-location-dot"></i> ${datos.direccion || 'Dirección'}</div>
                            <div><i class="fa-solid fa-id-card"></i> ${datos.cedula || 'Cédula'}</div>
                            <div><i class="fa-solid fa-calendar"></i> ${datos.nacimiento || 'Fecha Nac.'}</div>
                            <div><i class="fa-solid fa-flag"></i> ${datos.nacionalidad || 'Nacionalidad'} - ${datos.estadoCivil || 'Estado Civil'}</div>
                        </div>

                        <div class="cv-section">
                            <h2><i class="fa-solid fa-graduation-cap"></i> Educación</h2>
                            ${datos.educacion.map(e => `<p><strong>${e.institucion}:</strong> ${e.titulo}</p>`).join('') || '<p>No especificado</p>'}
                        </div>

                        <div class="cv-section">
                            <h2><i class="fa-solid fa-briefcase"></i> Experiencia</h2>
                            ${datos.experiencia.map(e => `<p><strong>${e.empresa}:</strong> ${e.puesto}</p>`).join('') || '<p>No especificado</p>'}
                        </div>

                        <div class="cv-section">
                            <h2><i class="fa-solid fa-certificate"></i> Cursos</h2>
                            ${datos.cursos.map(c => `<p><strong>${c.nombre}:</strong> ${c.institucion}</p>`).join('') || '<p>No especificado</p>'}
                        </div>

                        <div class="cv-section">
                            <h2><i class="fa-solid fa-address-book"></i> Referencias</h2>
                            <div class="grid-2">
                                ${datos.referencias.map(r => `
                                    <div class="referencia-item">
                                        <strong>${r.nombre}</strong><br>
                                        ${r.telefono}
                                    </div>
                                `).join('') || '<p>No especificado</p>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        // Recolectar datos del formulario
        function recolectarDatos() {
            const educacion = [];
            document.querySelectorAll('#educacionContainer .item-grid').forEach(el => {
                educacion.push({
                    institucion: el.querySelector('.edu-institucion')?.value || '',
                    titulo: el.querySelector('.edu-titulo')?.value || ''
                });
            });

            const experiencia = [];
            document.querySelectorAll('#experienciaContainer .item-grid').forEach(el => {
                experiencia.push({
                    empresa: el.querySelector('.exp-empresa')?.value || '',
                    puesto: el.querySelector('.exp-puesto')?.value || ''
                });
            });

            const cursos = [];
            document.querySelectorAll('#cursosContainer .item-grid').forEach(el => {
                cursos.push({
                    nombre: el.querySelector('.curso-nombre')?.value || '',
                    institucion: el.querySelector('.curso-institucion')?.value || ''
                });
            });

            const referencias = [];
            document.querySelectorAll('#referenciasContainer .item-grid').forEach(el => {
                referencias.push({
                    nombre: el.querySelector('.ref-nombre')?.value || '',
                    telefono: el.querySelector('.ref-telefono')?.value || ''
                });
            });

            return {
                foto: fotoBase64,
                nombre: document.getElementById('nombre').value,
                direccion: document.getElementById('direccion').value,
                telefono: document.getElementById('telefono').value,
                correo: document.getElementById('correo').value,
                nacionalidad: document.getElementById('nacionalidad').value,
                estadoCivil: document.getElementById('estadoCivil').value,
                cedula: document.getElementById('cedula').value,
                nacimiento: document.getElementById('nacimiento').value,
                objetivo: document.getElementById('objetivo').value,
                educacion,
                experiencia,
                cursos,
                referencias
            };
        }

        // Generar PDF (requiere html2pdf)
        window.generarPDF = function() {
            if (typeof html2pdf === 'undefined') {
                alert('La librería html2pdf.js no está cargada');
                return;
            }

            const element = document.getElementById('vistaPrevia').firstChild;
            const opt = {
                margin: [0.5, 0.5, 0.5, 0.5],
                filename: `Curriculum_${document.getElementById('nombre').value || 'usuario'}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, letterRendering: true },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</body>
</html>
